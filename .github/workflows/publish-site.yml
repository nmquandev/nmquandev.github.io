# Publishes the site to GitHub Pages on every push to master, with a version stamp.
# Version = MAJOR.MINOR from the VERSION file + the commit count, so every new commit gets a
# higher number and the same commit always gets the same one. The build writes
# assets/version.json (shown by the `version` command in the site's Terminal) and, once the
# deploy succeeds, tags the commit vX.Y.Z.
name: Publish site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # full history, for the commit count
      - id: version
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          echo "version=${base}.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - name: Collect the site files and stamp the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir _site
          cp -R index.html assets .nojekyll _site/
          # Cache-busting: browsers keep assets for 10 minutes, so give each build its own URLs
          sed -i -E "s#(assets/(site\.css|site\.js|lang\.js|config\.js|favicon\.svg|apple-touch-icon\.png))\"#\1?v=${VERSION}\"#g" _site/index.html
          grep -o 'assets/[a-z]*\.\(css\|js\)?v=[0-9.]*' _site/index.html
          printf '{"version":"%s","commit":"%s","built":"%s"}\n' \
            "$VERSION" "$(git rev-parse --short HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/assets/version.json
          cat _site/assets/version.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  tag:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may push the version tag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - env:
          TAG: v${{ needs.build.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
